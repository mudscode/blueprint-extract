[project]
name = "blueprint-extract"
version = "0.1.0"
description = "Architectural drawing PDFs to structured JSON with a vision model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.70",
    "pydantic>=2",
    "pymupdf>=1.24",
    "python-dotenv>=1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.scripts]
blueprint-extract = "blueprint_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fastapi>=0.110", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blueprint_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # Depends()/File() in defaults is the FastAPI idiom
